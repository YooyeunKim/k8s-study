name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/app/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/app
          push: true
          tags: |
            flexiblekim/openstream-backend:${{ github.sha }}
            flexiblekim/openstream-backend:latest

      - name: Update Kubernetes manifest
        run: |
          sed -i \
            "s|image: flexiblekim/openstream-backend:.*|image: flexiblekim/openstream-backend:${{ github.sha }}|" \
            backend/deployment.yaml

      - name: Commit manifest change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add backend/deployment.yaml
          git commit -m "Deploy backend ${{ github.sha }}" || exit 0
          git push